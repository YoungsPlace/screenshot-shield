<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Screenshot Shield 합성 신분 정보 가리기 전후 데모</title>
  <desc id="desc">가상 인물 김빵주의 이름, 무효 주민등록번호 예시, 가상 주소를 가리기 전과 후로 비교한 합성 데모입니다.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1120"/>
      <stop offset="1" stop-color="#172443"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b5cff"/>
      <stop offset="1" stop-color="#5daeff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#060814" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1200" height="700" rx="36" fill="url(#background)"/>
  <circle cx="90" cy="625" r="160" fill="#102237" opacity="0.8"/>
  <circle cx="1120" cy="72" r="190" fill="#18264c" opacity="0.7"/>

  <text x="600" y="68" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="34" font-weight="800">합성 신분 정보 안전 처리 데모</text>
  <text x="600" y="106" text-anchor="middle" fill="#aeb9d3" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18">실제 인물·주소·문서가 아닌 테스트 전용 데이터입니다</text>

  <g filter="url(#shadow)">
    <rect x="70" y="150" width="455" height="440" rx="28" fill="#f8f5ef"/>
    <rect x="675" y="150" width="455" height="440" rx="28" fill="#f8f5ef"/>
  </g>

  <rect x="98" y="176" width="180" height="30" rx="15" fill="#ffd5d8"/>
  <text x="188" y="197" text-anchor="middle" fill="#b72e3b" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="800" letter-spacing="2">BEFORE · 가리기 전</text>
  <rect x="703" y="176" width="176" height="30" rx="15" fill="#c8f4e3"/>
  <text x="791" y="197" text-anchor="middle" fill="#087a55" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14" font-weight="800" letter-spacing="2">AFTER · 가리기 후</text>

  <text x="98" y="238" fill="#111522" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="800">DEMO PROFILE</text>
  <text x="98" y="264" fill="#6e7482" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14">실제 주민등록증이 아닌 합성 예시</text>
  <text x="703" y="238" fill="#111522" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="21" font-weight="800">REDACTED COPY</text>
  <text x="703" y="264" fill="#6e7482" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14">검토 후 새 캔버스에 만든 결과</text>

  <g transform="translate(98 292)">
    <rect width="118" height="142" rx="24" fill="url(#blue)"/>
    <path d="M32 57c0-22 13-38 27-38s27 16 27 38v5c10 4 17 13 17 24 0 18-20 33-44 33S15 104 15 86c0-11 7-20 17-24z" fill="#f5c875"/>
    <circle cx="47" cy="73" r="4" fill="#111522"/>
    <circle cx="72" cy="73" r="4" fill="#111522"/>
    <path d="M49 91c7 6 14 6 21 0" fill="none" stroke="#111522" stroke-width="4" stroke-linecap="round"/>
    <text x="59" y="133" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="800">가상 캐릭터</text>
  </g>
  <g transform="translate(703 292)">
    <rect width="118" height="142" rx="24" fill="url(#blue)"/>
    <path d="M32 57c0-22 13-38 27-38s27 16 27 38v5c10 4 17 13 17 24 0 18-20 33-44 33S15 104 15 86c0-11 7-20 17-24z" fill="#f5c875"/>
    <rect x="23" y="63" width="72" height="24" rx="12" fill="#111522"/>
    <text x="59" y="133" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="13" font-weight="800">가림 처리됨</text>
  </g>

  <g font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
    <text x="238" y="310" fill="#727887" font-size="13" font-weight="700" letter-spacing="1">성명</text>
    <text x="238" y="342" fill="#111522" font-size="26" font-weight="800">김빵주</text>
    <text x="238" y="386" fill="#727887" font-size="13" font-weight="700" letter-spacing="1">주민등록번호 · 무효 예시번호</text>
    <text x="238" y="416" fill="#111522" font-size="21" font-weight="750">940913-1234567</text>
    <text x="98" y="474" fill="#727887" font-size="13" font-weight="700" letter-spacing="1">주소 · 가상 위치</text>
    <text x="98" y="505" fill="#111522" font-size="19" font-weight="700">서울 올림픽파크포레온 999동 999호</text>

    <text x="843" y="310" fill="#727887" font-size="13" font-weight="700" letter-spacing="1">성명</text>
    <rect x="843" y="323" width="132" height="28" rx="14" fill="#111522"/>
    <text x="843" y="386" fill="#727887" font-size="13" font-weight="700" letter-spacing="1">주민등록번호</text>
    <rect x="843" y="399" width="236" height="27" rx="13.5" fill="#111522"/>
    <text x="703" y="474" fill="#727887" font-size="13" font-weight="700" letter-spacing="1">주소</text>
    <rect x="703" y="488" width="362" height="28" rx="14" fill="#111522"/>
  </g>

  <g transform="translate(559 334)">
    <circle cx="41" cy="41" r="41" fill="#285cff"/>
    <path d="M22 41h34M45 28l13 13-13 13" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <rect x="98" y="540" width="399" height="24" rx="12" fill="#efe9dc"/>
  <text x="297" y="557" text-anchor="middle" fill="#8c7351" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="800" letter-spacing="1">SYNTHETIC DEMO · 실제 문서 아님</text>
  <rect x="703" y="540" width="399" height="24" rx="12" fill="#dff1eb"/>
  <text x="902" y="557" text-anchor="middle" fill="#147257" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="12" font-weight="800" letter-spacing="1">FRESH REDACTED OUTPUT</text>

  <text x="600" y="636" text-anchor="middle" fill="#ffffff" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="18" font-weight="800">원본은 공유 흐름에 넣지 않고, 검토한 새 결과물만 명시적으로 내보냅니다.</text>
  <text x="600" y="667" text-anchor="middle" fill="#8fa2c8" font-family="system-ui, -apple-system, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif" font-size="14">SYNTHETIC ONLY · LOCAL REDACTION · NO UPLOAD</text>
</svg>
