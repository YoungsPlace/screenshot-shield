    <circle cx="58" cy="27" r="8" fill="#ffd166"/>
    <circle cx="84" cy="27" r="8" fill="#42d392"/>
    <rect x="32" y="86" width="356" height="258" rx="22" fill="#ffffff"/>
    <rect x="58" y="122" width="140" height="18" rx="9" fill="#d9d1c2"/>
    <rect x="58" y="166" width="294" height="28" rx="14" fill="#10131f"/>
    <rect x="58" y="219" width="224" height="28" rx="14" fill="#10131f"/>
    <rect x="58" y="272" width="294" height="28" rx="14" fill="#10131f"/>
  </g>
